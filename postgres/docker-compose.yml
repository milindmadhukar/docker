networks:
  db:
    name: db
    external: true

services:
  db:
    image: postgres:17-alpine
    restart: always
    networks:
      - db
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sqls:/sqls
    ports:
      - 5432:5432

  adminer:
    image: adminer:latest
    restart: always
    networks:
      - db
    ports:
      - 8082:8080
